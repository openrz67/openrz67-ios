name: OpenRZ67
options:
  bundleIdPrefix: dev.hellevang
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenRZ67:
    type: application
    platform: iOS
    sources: [OpenRZ67]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hellevang.openrz67
        DEVELOPMENT_TEAM: KY7953NN8J
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: OpenRZ67/Info.plist
      properties:
        CFBundleDisplayName: OpenRZ67
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: OpenRZ67 uses Bluetooth to connect to the trigger on your camera.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
